name: Zone Clock v116 patch

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v116-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v116 final UI fixes
        run: python .github/scripts/zoneclock_v116_finish.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v116 markers
        run: |
          grep -q 'movement-test-editing' app.js
          grep -q 'hasMovementTestPoints' app.js
          grep -q 'ZONE CLOCK <strong>v1.16</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v116' service-worker.js

      - name: Commit fixes
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js
          git commit -m 'PWA v116: finish movement route editor UI'
          git push
