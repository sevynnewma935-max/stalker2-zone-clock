name: Zone Clock v116 patch

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v116-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v116 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, got {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label, flags=re.S):
              new_text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, got {count}')
              return new_text

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')

          app = replace_once(
              app,
              "  const MOVEMENT_TEST_ROUTE_KEY = 'stalker2-zone-clock-movement-test-route-v1';\n",
              "  const MOVEMENT_TEST_ROUTE_KEY = 'stalker2-zone-clock-movement-test-route-v1';\n  const MOVEMENT_TEST_CUSTOM_ROUTE_KEY = 'stalker2-zone-clock-movement-test-custom-route-v1';\n",
              'movement route storage key'
          )

          app = replace_once(
              app,
              "    movementTestRouteSelect: $('movementTestRouteSelect'),\n    movementTestRouteName: $('movementTestRouteName'),\n    movementTestHelp: $('movementTestHelp'),\n    showMovementTestRouteBtn: $('showMovementTestRouteBtn'),\n",
              "    movementTestPointCount: $('movementTestPointCount'),\n    movementTestRouteName: $('movementTestRouteName'),\n    movementTestHelp: $('movementTestHelp'),\n    editMovementTestRouteBtn: $('editMovementTestRouteBtn'),\n    mapMovementTestDoneBtn: $('mapMovementTestDoneBtn'),\n",
              'movement DOM refs'
          )

          dynamic_route_block = r'''  // Пользовательский тестовый маршрут. Точки задаются прямо на общей карте Zone Clock.
          function loadMovementTestRoutePoints() {
            try {
              const parsed = JSON.parse(
                localStorage.getItem(MOVEMENT_TEST_CUSTOM_ROUTE_KEY) || '[]'
              );

              if (!Array.isArray(parsed)) return [];

              return parsed
                .map(point => ({
                  x: Number(point?.x),
                  y: Number(point?.y)
                }))
                .filter(point =>
                  Number.isFinite(point.x) &&
                  Number.isFinite(point.y) &&
                  point.x >= 0 && point.x <= MAP_IMAGE_SIZE &&
                  point.y >= 0 && point.y <= MAP_IMAGE_SIZE
                );
            } catch (_) {
              return [];
            }
          }

          function movementTestRouteId(points) {
            if (!Array.isArray(points) || points.length < 2) {
              return 'custom_empty';
            }

            const source = points
              .map(point => `${Math.round(point.x * 10)},${Math.round(point.y * 10)}`)
              .join(';');

            let hash = 2166136261;
            for (let index = 0; index < source.length; index++) {
              hash ^= source.charCodeAt(index);
              hash = Math.imul(hash, 16777619);
            }

            return `custom_${(hash >>> 0).toString(36)}`;
          }

          let movementTestPoints = loadMovementTestRoutePoints();
          let movementTestRouteKey = movementTestRouteId(movementTestPoints);

          function saveMovementTestRoutePoints() {
            try {
              localStorage.setItem(
                MOVEMENT_TEST_CUSTOM_ROUTE_KEY,
                JSON.stringify(movementTestPoints)
              );
            } catch (_) {}

            movementTestRouteKey = movementTestRouteId(movementTestPoints);

            try {
              localStorage.setItem(
                MOVEMENT_TEST_ROUTE_KEY,
                movementTestRouteKey
              );
            } catch (_) {}
          }

          function getMovementTestRoute() {
            const points = movementTestPoints.map((point, index) => ({
              x: Number(point.x),
              y: Number(point.y),
              label: `Точка ${index + 1}`,
              shortLabel: `ТОЧКА ${index + 1}`
            }));

            const key = movementTestRouteId(points);
            movementTestRouteKey = key;

            const start = points.length ? points[0] : null;
            const end = points.length ? points[points.length - 1] : null;

            return {
              key,
              label: 'Свой тестовый маршрут',
              shortLabel: points.length
                ? `Свой маршрут · ${points.length} точек`
                : 'Свой маршрут',
              points,
              start,
              end,
              help: points.length >= 2
                ? 'Маршрут готов. Встаньте в точке 1, выберите темп и нажмите «СТАРТ». Пройдите через точки по порядку и в последней точке нажмите «ФИНИШ».'
                : 'Нажмите «СОЗДАТЬ ПО ТОЧКАМ» и поставьте на карте минимум две точки маршрута. Можно добавить столько промежуточных точек, сколько нужно.'
            };
          }

          const MOVEMENT_TEST_MODES = {'''

          app = sub_once(
              app,
              r"  // Контрольные отрезки для замера скорости перемещения\..*?  const MOVEMENT_TEST_MODES = \{",
              dynamic_route_block,
              'replace fixed movement routes'
          )

          app = replace_once(
              app,
              "  let mapMovementTestVisible = false;\n",
              "  let mapMovementTestVisible = false;\n  let movementTestReturnToDialog = false;\n",
              'movement map state'
          )

          update_map_info = r'''  function updateMapInfo() {
            updateMapZoneTime();
            const isMovementTestMode =
              mapSelectedRouteKey === MAP_ROUTE_MODE_MOVEMENT_TEST;

            if (els.mapDistance) {
              els.mapDistance.textContent = isMovementTestMode
                ? formatMapDistance(movementTestDistanceMeters())
                : formatMapDistance(mapRouteMeters());
            }

            if (els.mapPointCount) {
              els.mapPointCount.textContent = String(
                isMovementTestMode
                  ? movementTestPoints.length
                  : mapMeasurePoints.length
              );
            }

            if (els.mapMeasureBtn) {
              els.mapMeasureBtn.hidden = isMovementTestMode;
              els.mapMeasureBtn.classList.toggle('active', mapMeasureMode);
              els.mapMeasureBtn.textContent = mapMeasureMode ? 'ИЗМЕРЕНИЕ: ВКЛ' : 'ИЗМЕРИТЬ';
            }

            if (els.mapMeasureHint) {
              if (isMovementTestMode) {
                els.mapMeasureHint.textContent = loadActiveMovementTest()
                  ? 'Идёт замер скорости. Маршрут заблокирован до нажатия «ФИНИШ».'
                  : movementTestPoints.length >= 2
                    ? `Тестовый маршрут: ${movementTestPoints.length} точек · ${formatMapDistance(movementTestDistanceMeters())}. Нажмите на карту, чтобы добавить следующую точку.`
                    : 'Тестовый маршрут: нажимайте на карту, чтобы поставить минимум две точки. Перетаскивание двигает карту.';
              } else if (mapMeasureMode) {
                els.mapMeasureHint.textContent =
                  'Нажимайте на карту для добавления точек измерения. Перетаскивание двигает карту.';
              } else if (mapRoadPlannerRoutePoints.length >= 2) {
                els.mapMeasureHint.textContent =
                  `Маршрут по местоположениям: ${formatMapDistance(mapRoadPlannerMeters)} · точек ${mapRoadPlannerSequence.length}.`;
              } else if (els.mapRoadPlanner && els.mapRoadPlanner.open) {
                els.mapMeasureHint.textContent =
                  mapRoadPlannerSequence.length
                    ? `Выбрано точек: ${mapRoadPlannerSequence.length}. Нажмите следующую точку местоположения на карте.`
                    : 'Нажмите первую точку местоположения на карте. Затем выбирайте следующие по порядку.';
              } else if (mapMeasurePoints.length >= 2) {
                els.mapMeasureHint.textContent =
                  `Измерение: ${formatMapDistance(mapRouteMeters())}.`;
              } else {
                els.mapMeasureHint.textContent =
                  'Увеличение: два пальца, кнопки +/− или колёсико.';
              }
            }
          }


          function routePointToScreen'''

          app = sub_once(
              app,
              r"  function updateMapInfo\(\) \{.*?\n  \}\n\n\n  function routePointToScreen",
              update_map_info,
              'update map info'
          )

          update_preset_ui = r'''  function updatePresetRouteUI() {
            const isRoadPlannerMode = mapSelectedRouteKey === MAP_ROUTE_MODE_ROAD_PLANNER;
            const isMovementTestMode = mapSelectedRouteKey === MAP_ROUTE_MODE_MOVEMENT_TEST;
            const isCustomArtifactMode = mapSelectedRouteKey === MAP_ROUTE_MODE_CUSTOM_ARTIFACT;
            const isSpecialMode = isRoadPlannerMode || isMovementTestMode || isCustomArtifactMode;
            const activeRoute = getPresetRoute();
            const isGarbageRoute = !isSpecialMode && activeRoute.key === 'garbage_cement_cooling';
            const isRostokRoute = !isSpecialMode && activeRoute.key === 'rostok_redforest_yanov_jupiter_chemical';

            if (els.mapRouteSelect) els.mapRouteSelect.value = mapSelectedRouteKey;

            if (els.mapPresetRouteBtn) {
              els.mapPresetRouteBtn.hidden = isSpecialMode;
              els.mapPresetRouteBtn.textContent = mapPresetRouteVisible ? 'МАРШРУТ: ВКЛ' : 'МАРШРУТ: ВЫКЛ';
              els.mapPresetRouteBtn.classList.toggle('active', mapPresetRouteVisible);
            }

            if (els.mapJourneyBtn) els.mapJourneyBtn.hidden = isSpecialMode;

            if (els.mapArtifactVisitHint) {
              els.mapArtifactVisitHint.hidden = isRoadPlannerMode;
              if (isMovementTestMode) {
                els.mapArtifactVisitHint.textContent = loadActiveMovementTest()
                  ? 'Тестовый маршрут заблокирован: сначала завершите текущий замер скорости.'
                  : 'Тестовый маршрут: нажимайте на карту в нужной последовательности. − ТОЧКА удаляет последнюю, СБРОС очищает маршрут.';
              } else if (isCustomArtifactMode) {
                els.mapArtifactVisitHint.textContent =
                  'Свой маршрут: нажимайте артефакты в нужной последовательности. Повторное нажатие снимает точку с маршрута.';
              } else {
                els.mapArtifactVisitHint.textContent =
                  'Артефакты: нажмите точку после сбора. До 2 суток — СОБРАН, 2–3 суток — ВОЗМОЖНО ПОЯВИЛСЯ, после 3 суток — ПОРА ПРОВЕРИТЬ.';
              }
            }

            if (els.mapRoadPlanner) {
              els.mapRoadPlanner.hidden = !isRoadPlannerMode;
              els.mapRoadPlanner.open = isRoadPlannerMode && !mapFullscreenMode;
            }

            if (els.mapMovementTestDoneBtn) {
              els.mapMovementTestDoneBtn.hidden = !isMovementTestMode;
              els.mapMovementTestDoneBtn.disabled = false;
            }

            mapMovementTestVisible = isMovementTestMode;

            if (els.mapRouteStartWrap) {
              els.mapRouteStartWrap.hidden = !(isGarbageRoute || isRostokRoute);
            }

            if (els.mapRouteStartLabel) {
              els.mapRouteStartLabel.textContent = 'НАЧАЛО МАРШРУТА';
            }

            if (els.mapRouteStartSelect) {
              if (isGarbageRoute) {
                els.mapRouteStartSelect.innerHTML = '<option value="svalka">Свалка</option><option value="cement">Цементный завод</option>';
                els.mapRouteStartSelect.value = mapPresetRouteStart;
              } else if (isRostokRoute) {
                els.mapRouteStartSelect.innerHTML = '<option value="west">Росток — идём на запад</option><option value="east">Росток — идём на восток</option>';
                els.mapRouteStartSelect.value = mapRostokRouteStart;
              }
            }

            if (els.mapPresetRouteLabel) {
              if (isRoadPlannerMode) {
                els.mapPresetRouteLabel.hidden = false;
                els.mapPresetRouteLabel.textContent = mapRoadPlannerSequence.length
                  ? `По местоположениям · ${mapRoadPlannerSequence.length} точек`
                  : 'По местоположениям · выберите точки';
              } else if (isCustomArtifactMode) {
                els.mapPresetRouteLabel.hidden = false;
                els.mapPresetRouteLabel.textContent = mapCustomArtifactSequence.length
                  ? `Свой маршрут по артефактам · ${mapCustomArtifactSequence.length} точек`
                  : 'Свой маршрут по артефактам · выберите артефакты';
              } else if (isMovementTestMode) {
                const testRoute = getMovementTestRoute();
                els.mapPresetRouteLabel.hidden = false;
                els.mapPresetRouteLabel.textContent = testRoute.points.length
                  ? `ТЕСТОВЫЙ МАРШРУТ · ${testRoute.points.length} точек · ${formatMapDistance(movementTestDistanceMeters())}`
                  : 'ТЕСТОВЫЙ МАРШРУТ · поставьте точки на карте';
              } else {
                els.mapPresetRouteLabel.hidden = !mapPresetRouteVisible;
                els.mapPresetRouteLabel.textContent = isRostokRoute
                  ? `${activeRoute.label} · ${mapRostokRouteStart === 'east' ? 'Старт: Росток → восток' : 'Старт: Росток → запад'}`
                  : activeRoute.label;
              }
            }

            if (isCustomArtifactMode) {
              restoreCustomArtifactRoute();
              renderCustomArtifactRoute();
              requestCustomArtifactBuild();
            } else {
              updateCustomArtifactRouteGeometry();
            }

            updateMovementTestScreenGeometry();
            updateRoadPlannerScreenGeometry();
            updateCustomArtifactRouteGeometry();
            updateMapRouteHeaderSummary();
            updateMapInfo();
          }

          function updatePresetRouteScreenGeometry'''

          app = sub_once(
              app,
              r"  function updatePresetRouteUI\(\) \{.*?\n  \}\n\n  function updatePresetRouteScreenGeometry",
              update_preset_ui,
              'preset route UI'
          )

          app = replace_once(
              app,
              "      const hasMeasuredPoints =\n        mapMeasurePoints.length > 0;\n\n      els.mapFullscreenResetPointsBtn.disabled =\n        !(hasSelectedLocationPoints || hasSelectedArtifactPoints || hasMeasuredPoints);\n\n      els.mapFullscreenResetPointsBtn.title =\n        hasSelectedLocationPoints || hasSelectedArtifactPoints\n          ? 'Сбросить выбранные точки маршрута'\n          : 'Сбросить выбранные точки';\n",
              "      const hasMeasuredPoints =\n        mapMeasurePoints.length > 0;\n      const hasMovementTestPoints =\n        movementTestPoints.length > 0;\n\n      els.mapFullscreenResetPointsBtn.disabled =\n        !(hasSelectedLocationPoints || hasSelectedArtifactPoints || hasMeasuredPoints || hasMovementTestPoints);\n\n      els.mapFullscreenResetPointsBtn.title =\n        hasSelectedLocationPoints || hasSelectedArtifactPoints || hasMovementTestPoints\n          ? 'Сбросить выбранные точки маршрута'\n          : 'Сбросить выбранные точки';\n",
              'fullscreen reset state'
          )

          app = replace_once(
              app,
              "        if (mapSelectedRouteKey === MAP_ROUTE_MODE_CUSTOM_ARTIFACT && mapCustomArtifactSequence.length) {\n          clearCustomArtifactRoute();\n        } else if (mapRoadPlannerSequence.length) {\n          clearRoadPlanner();\n        } else {\n          clearMapMeasurement();\n        }\n",
              "        if (mapSelectedRouteKey === MAP_ROUTE_MODE_MOVEMENT_TEST && movementTestPoints.length) {\n          clearMovementTestRoute();\n        } else if (mapSelectedRouteKey === MAP_ROUTE_MODE_CUSTOM_ARTIFACT && mapCustomArtifactSequence.length) {\n          clearCustomArtifactRoute();\n        } else if (mapRoadPlannerSequence.length) {\n          clearRoadPlanner();\n        } else {\n          clearMapMeasurement();\n        }\n",
              'fullscreen reset handler'
          )

          app = replace_once(
              app,
              "  if (els.mapUndoBtn) {\n    els.mapUndoBtn.addEventListener('click', () => {\n      mapMeasurePoints.pop();\n      renderMapMeasurement();\n    });\n  }\n\n  if (els.mapClearBtn) {\n    els.mapClearBtn.addEventListener('click', () => {\n      if (mapSelectedRouteKey === MAP_ROUTE_MODE_CUSTOM_ARTIFACT) {\n        clearCustomArtifactRoute();\n      } else {\n        clearMapMeasurement();\n      }\n    });\n  }\n",
              "  if (els.mapUndoBtn) {\n    els.mapUndoBtn.addEventListener('click', () => {\n      if (mapSelectedRouteKey === MAP_ROUTE_MODE_MOVEMENT_TEST) {\n        undoMovementTestPoint();\n      } else {\n        mapMeasurePoints.pop();\n        renderMapMeasurement();\n      }\n    });\n  }\n\n  if (els.mapClearBtn) {\n    els.mapClearBtn.addEventListener('click', () => {\n      if (mapSelectedRouteKey === MAP_ROUTE_MODE_MOVEMENT_TEST) {\n        clearMovementTestRoute();\n      } else if (mapSelectedRouteKey === MAP_ROUTE_MODE_CUSTOM_ARTIFACT) {\n        clearCustomArtifactRoute();\n      } else {\n        clearMapMeasurement();\n      }\n    });\n  }\n\n  if (els.mapMovementTestDoneBtn) {\n    els.mapMovementTestDoneBtn.addEventListener('click', returnToMovementTest);\n  }\n",
              'undo clear movement handlers'
          )

          app = sub_once(
              app,
              r"\n      if \(mapSelectedRouteKey === MAP_ROUTE_MODE_MOVEMENT_TEST\) \{\n        if \(!MOVEMENT_TEST_ROUTES\[value\]\) return;.*?\n        return;\n      \}\n",
              "\n",
              'remove fixed route selector branch'
          )

          app = replace_once(
              app,
              "        const now = performance.now();\n",
              "        if (mapSelectedRouteKey === MAP_ROUTE_MODE_MOVEMENT_TEST) {\n          mapLastTapAt = 0;\n          if (!loadActiveMovementTest()) {\n            addMovementTestPoint(event.clientX, event.clientY);\n          }\n          return;\n        }\n\n        const now = performance.now();\n",
              'map tap movement point editor'
          )

          movement_logic = r'''  function movementTestDistanceMeters() {
            const route = getMovementTestRoute();
            if (!route.points || route.points.length < 2) return 0;
            return plannerPathMeters(route.points);
          }

          function formatMovementElapsed(seconds) {
            const safe = Math.max(0, Math.round(seconds));
            const minutes = Math.floor(safe / 60);
            const secs = safe % 60;

            if (minutes >= 60) {
              const hours = Math.floor(minutes / 60);
              const restMinutes = minutes % 60;
              return `${hours}:${String(restMinutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          }

          function loadMovementTests() {
            try {
              const data = JSON.parse(localStorage.getItem(MOVEMENT_TEST_STORAGE_KEY) || '{}');
              return data && typeof data === 'object' ? data : {};
            } catch (_) {
              return {};
            }
          }

          function saveMovementTests(data) {
            localStorage.setItem(MOVEMENT_TEST_STORAGE_KEY, JSON.stringify(data));
          }

          function loadActiveMovementTest() {
            try {
              const data = JSON.parse(localStorage.getItem(MOVEMENT_TEST_ACTIVE_KEY) || 'null');
              if (!data || !MOVEMENT_TEST_MODES[data.mode] || !(Number(data.startedAtMs) > 0)) {
                return null;
              }
              return data;
            } catch (_) {
              return null;
            }
          }

          function saveActiveMovementTest(data) {
            if (!data) {
              localStorage.removeItem(MOVEMENT_TEST_ACTIVE_KEY);
              return;
            }
            localStorage.setItem(MOVEMENT_TEST_ACTIVE_KEY, JSON.stringify(data));
          }

          function movementModeRuns(mode, routeKey = movementTestRouteKey) {
            const data = loadMovementTests();
            if (data[routeKey] && Array.isArray(data[routeKey][mode])) {
              return data[routeKey][mode];
            }
            if (routeKey === 'cement_swyd' && Array.isArray(data[mode])) {
              return data[mode];
            }
            return [];
          }

          function movementModeAverage(mode, routeKey = movementTestRouteKey) {
            const runs = movementModeRuns(mode, routeKey);
            if (!runs.length) return null;

            const valid = runs.filter(run =>
              Number.isFinite(Number(run.speedKmh)) && Number(run.speedKmh) > 0
            );
            if (!valid.length) return null;

            return {
              count: valid.length,
              speedKmh: valid.reduce((sum, run) => sum + Number(run.speedKmh), 0) / valid.length,
              realSeconds: valid.reduce((sum, run) => sum + Number(run.realSeconds), 0) / valid.length
            };
          }

          function routeSnapshotForMovement(route) {
            return {
              key: route.key,
              label: route.label,
              shortLabel: route.shortLabel,
              points: route.points.map(point => ({
                x: Number(point.x),
                y: Number(point.y),
                label: point.label,
                shortLabel: point.shortLabel
              })),
              start: route.start ? { ...route.start } : null,
              end: route.end ? { ...route.end } : null
            };
          }

          function updateMovementTestUi() {
            const active = loadActiveMovementTest();
            const currentRoute = getMovementTestRoute();
            const route = active?.routeSnapshot?.points?.length >= 2
              ? active.routeSnapshot
              : currentRoute;
            const distanceMeters = active && Number(active.distanceMeters) > 0
              ? Number(active.distanceMeters)
              : movementTestDistanceMeters();

            if (els.movementTestRouteName) {
              els.movementTestRouteName.textContent = 'СВОЙ ТЕСТОВЫЙ МАРШРУТ';
            }

            if (els.movementTestPointCount) {
              els.movementTestPointCount.textContent = String(currentRoute.points.length);
            }

            if (els.editMovementTestRouteBtn) {
              els.editMovementTestRouteBtn.disabled = Boolean(active);
              els.editMovementTestRouteBtn.textContent = active
                ? 'МАРШРУТ ЗАБЛОКИРОВАН'
                : currentRoute.points.length
                  ? 'ИЗМЕНИТЬ ПО ТОЧКАМ'
                  : 'СОЗДАТЬ ПО ТОЧКАМ';
            }

            if (els.movementTestHelp) {
              els.movementTestHelp.textContent = active
                ? 'Замер идёт. Точки маршрута нельзя менять до финиша.'
                : currentRoute.help;
            }

            if (els.movementTestDistance) {
              els.movementTestDistance.textContent = formatMapDistance(distanceMeters);
            }

            document.querySelectorAll('[data-movement-mode]').forEach(card => {
              const mode = card.dataset.movementMode;
              const result = card.querySelector(`[data-movement-result="${mode}"]`);
              const action = card.querySelector(`[data-movement-action="${mode}"]`);
              const average = movementModeAverage(mode, currentRoute.key);

              if (result) {
                result.textContent = average
                  ? `Среднее: ${average.speedKmh.toFixed(2)} км/ч · ${formatMovementElapsed(average.realSeconds)} · замеров ${average.count}`
                  : 'Нет замеров';
              }

              if (action) {
                const isThisActive = active && active.mode === mode;
                const otherActive = active && !isThisActive;
                action.textContent = isThisActive ? 'ФИНИШ' : 'СТАРТ';
                action.classList.toggle('danger', Boolean(isThisActive));
                action.disabled = Boolean(otherActive) || (!active && currentRoute.points.length < 2);
              }
            });

            if (els.movementTestStatus) {
              if (active) {
                const pointCount = route.points?.length || 0;
                els.movementTestStatus.textContent =
                  `${MOVEMENT_TEST_MODES[active.mode]}: замер идёт. Пройдите точки 1–${pointCount} по порядку и в точке ${pointCount} нажмите «ФИНИШ».`;
              } else if (currentRoute.points.length < 2) {
                els.movementTestStatus.textContent =
                  'Сначала создайте тестовый маршрут минимум из двух точек.';
              } else {
                els.movementTestStatus.textContent =
                  `Маршрут готов: ${currentRoute.points.length} точек · ${formatMapDistance(distanceMeters)}. Начните замер в точке 1.`;
              }
            }
          }

          function updateMovementLiveTimers() {
            const active = loadActiveMovementTest();
            const currentRoute = getMovementTestRoute();

            document.querySelectorAll('[data-movement-live]').forEach(node => {
              const mode = node.dataset.movementLive;
              if (active && active.mode === mode) {
                const elapsed = Math.max(0, (Date.now() - Number(active.startedAtMs)) / 1000);
                node.textContent = formatMovementElapsed(elapsed);
              } else {
                const runs = movementModeRuns(mode, currentRoute.key);
                const latest = runs.length ? runs[runs.length - 1] : null;
                node.textContent = latest
                  ? formatMovementElapsed(Number(latest.realSeconds) || 0)
                  : '00:00';
              }
            });
          }

          function startMovementTest(mode) {
            if (!MOVEMENT_TEST_MODES[mode]) return;
            updateNow();

            const route = getMovementTestRoute();
            const active = loadActiveMovementTest();

            if (active && active.mode !== mode) return;

            if (!active) {
              if (route.points.length < 2) {
                if (els.testMessage) {
                  els.testMessage.textContent = 'Сначала создайте маршрут минимум из двух точек.';
                }
                return;
              }

              const distanceMeters = movementTestDistanceMeters();
              saveActiveMovementTest({
                mode,
                routeKey: route.key,
                routeLabel: route.label,
                routeSnapshot: routeSnapshotForMovement(route),
                startedAtMs: Date.now(),
                startAbsoluteGameSeconds: Math.round(absoluteGameSeconds),
                startDay: gameDay,
                startTime: formatClock(gameSeconds),
                distanceMeters
              });

              updateMovementTestUi();
              updateMovementLiveTimers();
              updateMapInfo();

              if (els.testMessage) {
                els.testMessage.textContent =
                  `${MOVEMENT_TEST_MODES[mode]}: старт записан в точке 1. Финиш — точка ${route.points.length}.`;
              }
              return;
            }

            finishMovementTest(mode);
          }

          function finishMovementTest(mode) {
            const active = loadActiveMovementTest();
            if (!active || active.mode !== mode) return;

            const route = active.routeSnapshot?.points?.length >= 2
              ? active.routeSnapshot
              : routeSnapshotForMovement(getMovementTestRoute());
            const routeKey = active.routeKey || route.key;

            updateNow();
            const finishedAtMs = Date.now();
            const realSeconds = Math.max(0.1, (finishedAtMs - Number(active.startedAtMs)) / 1000);
            const endAbsoluteGameSeconds = Math.round(absoluteGameSeconds);
            const zoneSeconds = Math.max(
              0,
              endAbsoluteGameSeconds - Number(active.startAbsoluteGameSeconds)
            );
            const distanceMeters = Number(active.distanceMeters) > 0
              ? Number(active.distanceMeters)
              : plannerPathMeters(route.points);
            const speedKmh = (distanceMeters / 1000) / (realSeconds / 3600);

            const data = loadMovementTests();
            if (!data[routeKey] || typeof data[routeKey] !== 'object' || Array.isArray(data[routeKey])) {
              data[routeKey] = {};
            }
            if (!Array.isArray(data[routeKey][mode])) data[routeKey][mode] = [];

            data[routeKey][mode].push({
              routeKey,
              routeLabel: route.label || 'Свой тестовый маршрут',
              routePoints: route.points.map(point => ({ x: point.x, y: point.y })),
              mode,
              modeLabel: MOVEMENT_TEST_MODES[mode],
              startedAtMs: Number(active.startedAtMs),
              finishedAtMs,
              realSeconds: Math.round(realSeconds * 10) / 10,
              zoneSeconds,
              distanceMeters: Math.round(distanceMeters),
              speedKmh: Math.round(speedKmh * 100) / 100,
              startDay: active.startDay,
              startTime: active.startTime,
              endDay: gameDay,
              endTime: formatClock(gameSeconds),
              capturedAt: new Date().toISOString()
            });

            data[routeKey][mode] = data[routeKey][mode].slice(-20);
            saveMovementTests(data);
            saveActiveMovementTest(null);

            updateMovementTestUi();
            updateMovementLiveTimers();
            updateMapInfo();

            if (els.testMessage) {
              els.testMessage.textContent =
                `${MOVEMENT_TEST_MODES[mode]} · свой маршрут: ${formatMovementElapsed(realSeconds)}, ${speedKmh.toFixed(2)} км/ч.`;
            }
          }

          document.querySelectorAll('[data-movement-action]').forEach(button => {
            button.addEventListener('click', () => {
              startMovementTest(button.dataset.movementAction);
            });
          });

          function addMovementTestPoint(clientX, clientY) {
            if (loadActiveMovementTest()) return;
            const point = clientToMapPoint(clientX, clientY);
            if (!point) return;

            movementTestPoints.push(point);
            saveMovementTestRoutePoints();
            updateMovementTestScreenGeometry();
            updateMovementTestUi();
            updatePresetRouteUI();
            updateMapFullscreenUI();
            updateMapInfo();
          }

          function undoMovementTestPoint() {
            if (loadActiveMovementTest() || !movementTestPoints.length) return;
            movementTestPoints.pop();
            saveMovementTestRoutePoints();
            updateMovementTestScreenGeometry();
            updateMovementTestUi();
            updatePresetRouteUI();
            updateMapFullscreenUI();
            updateMapInfo();
          }

          function clearMovementTestRoute() {
            if (loadActiveMovementTest()) return;
            movementTestPoints = [];
            saveMovementTestRoutePoints();
            updateMovementTestScreenGeometry();
            updateMovementTestUi();
            updatePresetRouteUI();
            updateMapFullscreenUI();
            updateMapInfo();
          }

          function updateMovementTestScreenGeometry() {
            if (
              !els.mapMovementTestLayer ||
              !els.mapMovementTestLine ||
              !els.mapMovementTestStart ||
              !els.mapMovementTestEnd
            ) return;

            const route = getMovementTestRoute();
            const points = route.points || [];
            const show = mapMovementTestVisible && points.length > 0;
            els.mapMovementTestLayer.style.display = show ? '' : 'none';
            if (!show) {
              els.mapMovementTestLine.setAttribute('points', '');
              return;
            }

            const screenPoints = points.map(routePointToScreen);
            els.mapMovementTestLine.setAttribute(
              'points',
              screenPoints.map(point => `${point.x},${point.y}`).join(' ')
            );

            els.mapMovementTestLayer
              .querySelectorAll('.map-movement-test-waypoint')
              .forEach(node => node.remove());

            const start = screenPoints[0];
            els.mapMovementTestStart.style.display = '';
            els.mapMovementTestStart.setAttribute('cx', start.x);
            els.mapMovementTestStart.setAttribute('cy', start.y);

            const hasEnd = screenPoints.length >= 2;
            const end = screenPoints[screenPoints.length - 1];
            els.mapMovementTestEnd.style.display = hasEnd ? '' : 'none';
            if (hasEnd) {
              els.mapMovementTestEnd.setAttribute('cx', end.x);
              els.mapMovementTestEnd.setAttribute('cy', end.y);
            }

            if (els.mapMovementTestStartLabel) {
              els.mapMovementTestStartLabel.setAttribute('x', start.x + 10);
              els.mapMovementTestStartLabel.setAttribute('y', start.y - 10);
              els.mapMovementTestStartLabel.textContent = '1 · СТАРТ';
            }

            if (els.mapMovementTestEndLabel) {
              els.mapMovementTestEndLabel.style.display = hasEnd ? '' : 'none';
              if (hasEnd) {
                els.mapMovementTestEndLabel.setAttribute('x', end.x + 10);
                els.mapMovementTestEndLabel.setAttribute('y', end.y - 10);
                els.mapMovementTestEndLabel.textContent = `${screenPoints.length} · ФИНИШ`;
              }
            }

            for (let index = 1; index < screenPoints.length - 1; index++) {
              const point = screenPoints[index];
              const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              circle.setAttribute('class', 'map-movement-test-point waypoint map-movement-test-waypoint');
              circle.setAttribute('r', '5');
              circle.setAttribute('cx', point.x);
              circle.setAttribute('cy', point.y);

              const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
              label.setAttribute('class', 'map-movement-test-label map-movement-test-waypoint');
              label.setAttribute('x', point.x + 9);
              label.setAttribute('y', point.y - 8);
              label.textContent = String(index + 1);

              els.mapMovementTestLayer.appendChild(circle);
              els.mapMovementTestLayer.appendChild(label);
            }

            if (els.mapMovementTestDistanceLabel) {
              const middle = screenPoints[Math.floor((screenPoints.length - 1) / 2)];
              els.mapMovementTestDistanceLabel.setAttribute('x', middle.x);
              els.mapMovementTestDistanceLabel.setAttribute('y', middle.y - 16);
              els.mapMovementTestDistanceLabel.textContent =
                screenPoints.length >= 2
                  ? formatMapDistance(movementTestDistanceMeters())
                  : '';
            }
          }

          function openMovementTestRouteEditor() {
            if (loadActiveMovementTest()) return;
            movementTestReturnToDialog = true;
            mapSelectedRouteKey = MAP_ROUTE_MODE_MOVEMENT_TEST;
            mapMovementTestVisible = true;
            mapMeasureMode = false;
            localStorage.setItem(MAP_PRESET_ROUTE_SELECTED_KEY, mapSelectedRouteKey);
            ensureRoadPlannerLandscapeView();

            if (els.testDialog?.open) {
              if (typeof els.testDialog.close === 'function') els.testDialog.close();
              else els.testDialog.removeAttribute('open');
            }

            updateMapZoneTime();
            updateMapFullscreenUI();
            updatePresetRouteUI();

            if (typeof els.mapDialog.showModal === 'function') {
              if (!els.mapDialog.open) els.mapDialog.showModal();
            } else {
              els.mapDialog.setAttribute('open', '');
            }

            window.requestAnimationFrame(() => {
              if (movementTestPoints.length) {
                focusJourneyPoints(movementTestPoints, 600);
              } else {
                fitZoneMap();
              }
              updateMovementTestScreenGeometry();
              updateMapInfo();
            });
          }

          function returnToMovementTest() {
            if (els.mapDialog?.open) {
              if (typeof els.mapDialog.close === 'function') els.mapDialog.close();
              else els.mapDialog.removeAttribute('open');
            }

            movementTestReturnToDialog = false;
            updateMovementTestUi();
            updateMovementLiveTimers();

            window.requestAnimationFrame(() => {
              if (typeof els.testDialog.showModal === 'function') {
                if (!els.testDialog.open) els.testDialog.showModal();
              } else {
                els.testDialog.setAttribute('open', '');
              }
            });
          }

          if (els.editMovementTestRouteBtn) {
            els.editMovementTestRouteBtn.addEventListener('click', openMovementTestRouteEditor);
          }

          window.setInterval(() => {'''

          app = sub_once(
              app,
              r"  function movementTestDistanceMeters\(.*?\n  window\.setInterval\(\(\) => \{",
              movement_logic,
              'movement test logic'
          )

          export_loop = r'''    Object.entries(movementTests).forEach(([routeKey, routeData]) => {
              if (!routeData || typeof routeData !== 'object' || Array.isArray(routeData)) return;

              ['slow', 'fast', 'run'].forEach(mode => {
                const runs = Array.isArray(routeData[mode]) ? routeData[mode] : [];
                runs.forEach(run => {
                  rows.push([
                    run.routeLabel || 'Свой тестовый маршрут',
                    MOVEMENT_TEST_MODES[mode],
                    run.distanceMeters || '',
                    run.realSeconds || '',
                    run.zoneSeconds || '',
                    run.speedKmh || '',
                    run.startDay || '',
                    run.startTime || '',
                    run.endDay || '',
                    run.endTime || '',
                    run.capturedAt || ''
                  ]);
                });
              });
            });

            // Старые результаты до появления пользовательских маршрутов.
            ['slow', 'fast', 'run'].forEach(mode => {
              const runs = Array.isArray(movementTests[mode]) ? movementTests[mode] : [];
              runs.forEach(run => {
                rows.push([
                  run.routeLabel || 'Старый контрольный маршрут',
                  MOVEMENT_TEST_MODES[mode],
                  run.distanceMeters || '',
                  run.realSeconds || '',
                  run.zoneSeconds || '',
                  run.speedKmh || '',
                  run.startDay || '',
                  run.startTime || '',
                  run.endDay || '',
                  run.endTime || '',
                  run.capturedAt || ''
                ]);
              });
            });

            const daylightMarks = loadDaylightMarks();'''

          app = sub_once(
              app,
              r"    Object\.keys\(\n      MOVEMENT_TEST_ROUTES\n    \).*?\n\n    const daylightMarks = loadDaylightMarks\(\);",
              export_loop,
              'CSV movement export'
          )

          app = app.replace("zone-clock-test-v115.csv", "zone-clock-test-v116.csv")

          if 'MOVEMENT_TEST_ROUTES' in app:
              raise SystemExit('MOVEMENT_TEST_ROUTES reference remained after patch')

          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          html = replace_once(
              html,
              '<button class="btn" id="mapClearBtn" type="button">СБРОС</button>\n',
              '<button class="btn" id="mapClearBtn" type="button">СБРОС</button>\n<button class="btn primary" hidden id="mapMovementTestDoneBtn" type="button">В ТЕСТ</button>\n',
              'map movement done button'
          )

          html = html.replace(
              '<option value="movement_test">Тестовый маршрут</option>',
              '<option value="movement_test">Тестовый маршрут по точкам</option>'
          )

          movement_section = '''<section class="movement-test-block">
          <div class="movement-test-head">
            <div>
              <div class="daylight-test-title">ТЕСТ СКОРОСТИ ПЕРЕДВИЖЕНИЯ</div>
              <div class="movement-test-route" id="movementTestRouteName">СВОЙ ТЕСТОВЫЙ МАРШРУТ</div>
            </div>
            <button class="btn movement-map-btn" id="editMovementTestRouteBtn" type="button">СОЗДАТЬ ПО ТОЧКАМ</button>
          </div>
          <div class="movement-test-distance-row">
            <span>ТОЧЕК <strong id="movementTestPointCount">0</strong></span>
            <span>РАССТОЯНИЕ <strong id="movementTestDistance">—</strong></span>
          </div>
          <div class="movement-test-help" id="movementTestHelp">
            Нажмите «СОЗДАТЬ ПО ТОЧКАМ» и поставьте на карте минимум две точки маршрута. Можно добавить промежуточные точки.
          </div>
          <div class="movement-test-modes">
            <div class="movement-test-card" data-movement-mode="slow">
              <div class="movement-test-mode-title">МЕДЛЕННЫЙ ШАГ</div>
              <div class="movement-live-time" data-movement-live="slow">00:00</div>
              <div class="movement-test-result" data-movement-result="slow">Нет замеров</div>
              <button class="btn primary movement-test-action" data-movement-action="slow" type="button">СТАРТ</button>
            </div>
            <div class="movement-test-card" data-movement-mode="fast">
              <div class="movement-test-mode-title">БЫСТРЫЙ ШАГ</div>
              <div class="movement-live-time" data-movement-live="fast">00:00</div>
              <div class="movement-test-result" data-movement-result="fast">Нет замеров</div>
              <button class="btn primary movement-test-action" data-movement-action="fast" type="button">СТАРТ</button>
            </div>
            <div class="movement-test-card" data-movement-mode="run">
              <div class="movement-test-mode-title">БЕГ</div>
              <div class="movement-live-time" data-movement-live="run">00:00</div>
              <div class="movement-test-result" data-movement-result="run">Нет замеров</div>
              <button class="btn primary movement-test-action" data-movement-action="run" type="button">СТАРТ</button>
            </div>
          </div>
          <div class="movement-test-status" id="movementTestStatus">
            Сначала создайте тестовый маршрут минимум из двух точек.
          </div>
        </section>'''

          html = sub_once(
              html,
              r'<section class="movement-test-block">.*?</section>',
              movement_section,
              'movement test HTML'
          )

          html = html.replace('>МОСТ</text>', '>СТАРТ</text>')
          html = html.replace('>SWYD-EAST</text>', '>ФИНИШ</text>')
          html = replace_once(
              html,
              'ZONE CLOCK <strong>v1.15</strong>',
              'ZONE CLOCK <strong>v1.16</strong>',
              'visible version'
          )
          index_path.write_text(html, encoding='utf-8')

          style_path = Path('style.css')
          css = style_path.read_text(encoding='utf-8')
          css += r'''

/* PWA v116 — пользовательский тестовый маршрут по точкам */
.map-screen-overlay .map-movement-test-point.waypoint {
  fill: #d9ffd9;
  stroke: #25df4c;
  stroke-width: 2px;
}

.map-screen-overlay .map-movement-test-waypoint {
  pointer-events: none;
}

.movement-test-distance-row {
  align-items: center;
}

.movement-test-distance-row > span {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
}

.movement-test-distance-row strong {
  color: var(--accent-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 900;
}
'''
          style_path.write_text(css, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          if sw.count('v115') < 2:
              raise SystemExit('service worker v115 cache names not found')
          sw = sw.replace('v115', 'v116')
          sw_path.write_text(sw, encoding='utf-8')

          readme_path = Path('README.txt')
          readme = readme_path.read_text(encoding='utf-8').rstrip() + '''\n\n\nВерсия 116:\n- из теста скорости убран выбор двух фиксированных контрольных маршрутов;\n- тестовый маршрут теперь создаётся пользователем по точкам прямо на общей карте Zone Clock;\n- можно поставить две или больше точек в нужной последовательности;\n- длина тестового маршрута считается как сумма всех отрезков между точками;\n- кнопка «− ТОЧКА» удаляет последнюю точку, «СБРОС» очищает маршрут;\n- кнопка «В ТЕСТ» возвращает с карты к замеру скорости;\n- во время активного замера редактирование маршрута блокируется;\n- результаты скорости сохраняются отдельно для каждой геометрии пользовательского маршрута;\n- версия приложения обновлена до ZONE CLOCK v1.16;\n- service worker обновлён до v116;\n- CSV экспортируется как zone-clock-test-v116.csv.\n'''
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check app.js && node --check service-worker.js

      - name: Validate required v116 markers
        run: |
          grep -q 'ZONE CLOCK <strong>v1.16</strong>' index.html
          grep -q 'movementTestPointCount' index.html
          grep -q 'MOVEMENT_TEST_CUSTOM_ROUTE_KEY' app.js
          grep -q 'stalker2-zone-clock-app-v116' service-worker.js
          ! grep -q 'MOVEMENT_TEST_ROUTES' app.js

      - name: Commit v116
        run: |
          git config user.name "Zone Clock Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js README.txt
          git commit -m "PWA v116: custom movement test route points"
          git push
