name: Zone Clock v126 daypart boundary

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v126-daypart-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v126 patch
        run: python .github/scripts/zoneclock_v126_daypart_boundary.py

      - name: Validate
        run: |
          node --check app.js
          node --check service-worker.js
          grep -q 'class="daypart-stack"' index.html
          grep -q 'class="daypart-boundary"' index.html
          ! grep -q 'hero-stats hero-stats-single' index.html
          grep -q 'ZONE CLOCK <strong>v1.26</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v126' service-worker.js
          grep -q 'stalker2-zone-clock-map-v126' service-worker.js

      - name: Commit v126
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add style.css index.html service-worker.js README.txt
          git commit -m 'PWA v126: move boundary under daypart'
          git push
