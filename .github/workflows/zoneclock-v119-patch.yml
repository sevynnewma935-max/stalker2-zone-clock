name: Zone Clock v119 patch

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v119-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v119 patch
        run: python .github/scripts/zoneclock_v119_patch.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v119 markers
        run: |
          grep -q 'ZONE CLOCK <strong>v1.19</strong>' index.html
          grep -q "navigator.wakeLock.request('screen')" app.js
          grep -q 'stalker2-zone-clock-app-v119' service-worker.js
          grep -q 'stalker2-zone-clock-map-v119' service-worker.js

      - name: Commit v119
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html service-worker.js README.txt
          git commit -m 'PWA v119: keep screen awake while app is active'
          git push
