name: Zone Clock v121 map first

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v121-map-first.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v121 patch
        run: python .github/scripts/zoneclock_v121_map_first.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v121 markers
        run: |
          grep -q 'PWA v121 — при открытии окна сначала карта' style.css
          grep -q 'ZONE CLOCK <strong>v1.21</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v121' service-worker.js
          grep -q 'stalker2-zone-clock-map-v121' service-worker.js

      - name: Commit v121
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add style.css index.html service-worker.js README.txt
          git commit -m 'PWA v121: show map before controls'
          git push
