name: Build PWA v118 archive

on:
  push:
    paths:
      - '.github/workflows/build-pwa-v118-archive.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v118
        run: |
          grep -q 'ZONE CLOCK <strong>v1.18</strong>' index.html
          grep -q 'mapRouteRecordBtn' index.html
          grep -q 'ЗАПИСАННЫЕ МАРШРУТЫ' app.js
          grep -q "zone-clock-test-v118.csv" app.js
          grep -q 'const SLEEP_GAME_SECONDS = 7 \* 3600' app.js
          grep -q 'stalker2-zone-clock-app-v118' service-worker.js
          node --check app.js
          node --check service-worker.js
      - name: Upload deployable PWA
        uses: actions/upload-artifact@v4
        with:
          name: PWA-v118
          path: |
            index.html
            app.js
            style.css
            service-worker.js
            manifest.webmanifest
            README.txt
            api/
            vercel.json
            icons/
            assets/
          if-no-files-found: error
          compression-level: 6
