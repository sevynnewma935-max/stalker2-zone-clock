name: Zone Clock v118 final fixes

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v118-finish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v118 final fixes
        run: python .github/scripts/zoneclock_v118_finish.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate final v118
        run: |
          grep -q "zone-clock-test-v118.csv" app.js
          grep -q "ЗАПИСАННЫЕ МАРШРУТЫ" app.js
          grep -q "Росток → Янов" index.html
          grep -q "const SLEEP_GAME_SECONDS = 7 \* 3600" app.js
          grep -q "stalker2-zone-clock-app-v118" service-worker.js

      - name: Commit final v118
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'PWA v118: finalize route recording and CSV export'
          git push
