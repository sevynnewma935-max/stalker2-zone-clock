name: Zone Clock v118 patch

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v118-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v118 patch
        run: python .github/scripts/zoneclock_v118_patch.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v118 markers
        run: |
          grep -q 'ZONE CLOCK <strong>v1.18</strong>' index.html
          grep -q 'mapRouteRecordBtn' index.html
          grep -q 'ROUTE_RECORD_STORAGE_KEY' app.js
          grep -q 'const SLEEP_GAME_SECONDS = 7 \* 3600' app.js
          grep -q 'stalker2-zone-clock-app-v118' service-worker.js
          ! grep -q 'movement-test-block' index.html

      - name: Commit v118
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html style.css service-worker.js README.txt
          git commit -m 'PWA v118: ordinary route recording and 7h sleep'
          git push
