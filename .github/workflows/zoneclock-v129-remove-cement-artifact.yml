name: Zone Clock v129 remove cement artifact

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v129-remove-cement-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v129 patch
        run: python .github/scripts/zoneclock_v129_remove_cement_artifact.py

      - name: Validate
        run: |
          node --check app.js
          node --check service-worker.js
          grep -Fq "{ routeKey: 'garbage_cement_cooling', exclude: new Set([3, 6, 13]) }," app.js
          grep -Fq "{ x: 1187.4, y: 993.9" app.js
          grep -q 'ZONE CLOCK <strong>v1.29</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v129' service-worker.js
          grep -q 'stalker2-zone-clock-map-v129' service-worker.js

      - name: Commit v129
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html service-worker.js README.txt
          git commit -m 'PWA v129: remove incorrect cement artifact point'
          git push
