name: Zone Clock v120 location labels

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v120-locations-all-maps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v120 patch
        run: python .github/scripts/zoneclock_v120_locations_all_maps.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v120 markers
        run: |
          grep -q 'plannerActive' app.js
          grep -q 'map-known-location.is-passive' style.css
          grep -q 'ZONE CLOCK <strong>v1.20</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v120' service-worker.js
          grep -q 'stalker2-zone-clock-map-v120' service-worker.js

      - name: Commit v120
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js style.css index.html service-worker.js README.txt
          git commit -m 'PWA v120: show location labels on every map'
          git push
