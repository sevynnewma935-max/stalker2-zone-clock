name: Zone Clock v117 patch

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v117-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v117 patch
        run: python .github/scripts/zoneclock_v117_patch.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v117 markers
        run: |
          grep -q 'ZONE CLOCK <strong>v1.17</strong>' index.html
          grep -q 'mapSavedRouteEditor' index.html
          grep -q 'movementTestSavedRouteSelect' index.html
          grep -q 'SAVED_ROUTE_STORAGE_KEY' app.js
          grep -q 'saveCurrentNamedRoute' app.js
          grep -q 'stalker2-zone-clock-app-v117' service-worker.js

      - name: Commit v117
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html style.css service-worker.js README.txt
          git commit -m 'PWA v117: named routes and test route library'
          git push
