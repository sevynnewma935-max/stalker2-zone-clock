name: Zone Clock v125 emission layout

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v125-emission-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v125 patch
        run: python .github/scripts/zoneclock_v125_emission_layout.py

      - name: Validate
        run: |
          node --check app.js
          node --check service-worker.js
          grep -q 'PWA v125 — последний выброс отдельной строкой' style.css
          grep -q 'ZONE CLOCK <strong>v1.25</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v125' service-worker.js
          grep -q 'stalker2-zone-clock-map-v125' service-worker.js

      - name: Commit v125
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add style.css index.html service-worker.js README.txt
          git commit -m 'PWA v125: full-width emission action'
          git push
