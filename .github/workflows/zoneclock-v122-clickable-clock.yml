name: Zone Clock v122 clickable clock

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v122-clickable-clock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v122 patch
        run: python .github/scripts/zoneclock_v122_clickable_clock.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v122 markers
        run: |
          grep -q 'PWA v122 — изменение времени напрямую' app.js
          grep -q 'clock-edit-dialog' index.html
          grep -q 'ZONE CLOCK <strong>v1.22</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v122' service-worker.js
          grep -q 'stalker2-zone-clock-map-v122' service-worker.js

      - name: Commit v122
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js style.css index.html service-worker.js README.txt
          git commit -m 'PWA v122: edit time by tapping clock'
          git push
