name: Zone Clock v136 red roads

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v136-redroads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate red-road routing model and update app
        run: python3 scripts/build_zone_redroads_v136.py

      - name: Validate compiled PWA and asset
        run: |
          node --check app.js
          node --check service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          import struct
          blob = Path('assets/zone-road-cost-red-v136.png').read_bytes()
          assert blob.startswith(b'\x89PNG\r\n\x1a\n')
          assert struct.unpack('>II', blob[16:24]) == (512, 512)
          assert len(blob) > 6000
          assert 'zone-road-cost-red-v136.png' in Path('app.js').read_text()
          assert 'ZONE CLOCK <strong>v1.36</strong>' in Path('index.html').read_text()
          print('Road asset validated:', len(blob), 'bytes')
          PY

      - name: Commit and deploy v136
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/zone-road-cost-red-v136.png app.js index.html service-worker.js README.txt
          git commit -m 'PWA v136: route along user red-road network'
          git push
