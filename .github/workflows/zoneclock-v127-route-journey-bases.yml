name: Zone Clock v127 route journey and bases

on:
  push:
    paths:
      - '.github/workflows/zoneclock-v127-route-journey-bases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v127 patch
        run: python .github/scripts/zoneclock_v127_route_journey_bases.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate v127
        run: |
          grep -q 'id="mapArtifactBaseSelect"' index.html
          grep -q 'MAP_ARTIFACT_BASE_KEYS' app.js
          grep -q 'function canStartSelectedJourney' app.js
          grep -q 'function getCustomArtifactJourneyPlan' app.js
          grep -q 'function getMovementJourneyPlan' app.js
          grep -q 'ZONE CLOCK <strong>v1.27</strong>' index.html
          grep -q 'stalker2-zone-clock-app-v127' service-worker.js
          grep -q 'stalker2-zone-clock-map-v127' service-worker.js

      - name: Commit v127
        run: |
          git config user.name 'Zone Clock Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js style.css index.html service-worker.js README.txt
          git commit -m 'PWA v127: journey button for all routes and bases in artifact routes'
          git push
